# The profile dropdown replaces the four preset buttons in standard firmware.
# Keep their actions internally so preset selection still uses one implementation.
button:
  - id: !extend curve_preset_silent
    internal: true
  - id: !extend curve_preset_balanced
    internal: true
  - id: !extend curve_preset_aggressive
    internal: true
  - id: !extend curve_preset_server
    internal: true
