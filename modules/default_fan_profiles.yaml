# Profile controls included in the standard firmware for every board revision.
# Keep first-time installs and upgrades in manual control until the user opts in.
# RESTORE_DEFAULT_OFF preserves an existing auto-control choice across reboots.
packages:
  temperature_curve: !include temperature_curve.yaml

switch:
  - id: !extend auto_control_fan1
    restore_mode: RESTORE_DEFAULT_OFF
  - id: !extend auto_control_fan2
    restore_mode: RESTORE_DEFAULT_OFF
  - id: !extend auto_control_fan3
    restore_mode: RESTORE_DEFAULT_OFF
  - id: !extend auto_control_fan4
    restore_mode: RESTORE_DEFAULT_OFF

# Simple controls beside each fan; existing switches remain for automations.
select:
  - platform: template
    name: "Fan 1 Mode"
    id: fan1_control_mode
    icon: mdi:fan-auto
    options:
      - Manual
      - Automatic
    update_interval: 1s
    lambda: |-
      const char *mode = id(auto_control_fan1).state ? "Automatic" : "Manual";
      if (id(fan1_control_mode).has_state() &&
          id(fan1_control_mode).current_option() == mode) return {};
      return std::string(mode);
    set_action:
      - lambda: |-
          if (x == "Automatic") id(auto_control_fan1).turn_on();
          else id(auto_control_fan1).turn_off();
          id(curve_output_value).update();
          id(fan1_control_mode).update();

  - platform: template
    name: "Fan 2 Mode"
