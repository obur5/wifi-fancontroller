# Profile controls included in the standard firmware for every board revision.
# Keep first-time installs and upgrades in manual control until the user opts in.
# RESTORE_DEFAULT_OFF preserves an existing auto-control choice across reboots.
packages:
  temperature_curve: !include temperature_curve.yaml

switch:
  - id: !extend auto_control_fan1
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: ""
    on_turn_on:
      - component.update: curve_output_value
  - id: !extend auto_control_fan2
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: ""
    on_turn_on:
      - component.update: curve_output_value
  - id: !extend auto_control_fan3
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: ""
    on_turn_on:
      - component.update: curve_output_value
  - id: !extend auto_control_fan4
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: ""
    on_turn_on:
      - component.update: curve_output_value

# The profile dropdown replaces the four preset buttons in standard firmware.
# Keep their actions internally so preset selection still uses one implementation.
button:
  - id: !extend curve_preset_silent
    internal: true
  - id: !extend curve_preset_balanced
    internal: true
  - id: !extend curve_preset_aggressive
    internal: true
  - id: !extend curve_preset_server
    internal: true
